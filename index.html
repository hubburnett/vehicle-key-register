<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Key Register">
  <link rel="apple-touch-icon" href="hub_web_logo.png">
  <title>Vehicle Keys Sign In / Sign Out Register</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background-color: #fdf1e9;
      color: #333;
      padding: 20px;
      -webkit-tap-highlight-color: transparent;
    }
    .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }
    #welcomeScreen { text-align: center; padding: 40px; }
    #welcomeScreen img { max-width: 200px; margin-bottom: 20px; }
    #welcomeScreen button {
      font-size: 1.5rem; padding: 15px 25px;
      border: none; background-color: #007bff;
      color: #fff; border-radius: 5px; cursor: pointer;
    }
    #mainInterface { display: none; }
    .panels { display: flex; flex-wrap: nowrap; justify-content: center; }
    .panel {
      background: #fff; border: 1px solid #ccc; border-radius: 6px;
      padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      flex-grow: 1; max-width: 500px; min-width: 0;
    }
    #signOutPanel { flex-basis: 50%; margin-right: 1rem; }
    #signInPanel  { flex-basis: 50%; }
    .panel h3 { text-align: center; margin-bottom: 20px; font-size: 1.8rem; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 1.3rem; }
    input[type="text"], select {
      width: 100%; padding: 16px; font-size: 1.4rem;
      border: 1px solid #ccc; border-radius: 4px;
    }
    .btn {
      display: block; width: 100%; padding: 20px;
      border: none; border-radius: 4px; font-size: 1.6rem;
      color: #fff; cursor: pointer; margin-top: 10px;
    }
    .btn-sign-out { background-color: #d9534f; }
    .btn-sign-in  { background-color: #5cb85c; }
    .btn-logs { background-color: #6c757d; }
    #logViewer { display: none; }
    #logViewer table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    #logViewer th, #logViewer td { padding: 10px; border: 1px solid #ccc; text-align: left; font-size: 0.9rem; }
    .inline-flex { display: flex; }
    .inline-flex > * + * { margin-left: 10px; }
    #vehiclePreview { display: block; margin: 0 auto 15px; max-width: 100%; height: auto; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <div id="welcomeScreen">
      <img src="hub_logo.png" onerror="this.style.display='none';" alt="HUB LOGO">
      <h2>VEHICLE KEYS SIGN IN / SIGN OUT</h2>
      <button id="continueBtn" style="margin-top:20px;">Tap to Continue</button>     
    </div>

    <div id="mainInterface">
      <div class="panels">
        <div class="panel" id="signOutPanel">
          <h3>Sign Out</h3>
          <div class="form-group inline-flex">
            <div style="flex:1;"><label>Name</label><input type="text" id="outName"></div>
            <div style="flex:1;"><label>Participant</label><input type="text" id="outParticipant" style="text-transform:uppercase;"></div>
          </div>
          <div class="form-group"><label><input type="checkbox" id="manualOutToggle"> Manual Date/Time</label></div>
          <div id="manualOutFields" class="inline-flex" style="display:none; flex-wrap:wrap;">
            <div><label>Date</label><input type="text" id="outDateManual"></div>
            <div><label>Time</label><input type="text" id="outTimeManual"></div>
          </div>
          <div class="form-group"><label>Destination</label><input type="text" id="outDestination"></div>
          <div class="form-group">
            <label>Vehicle</label>
            <img id="vehiclePreview" src="" alt="" style="display:none;">
            <select id="outVehicle">
              <option value="">-- Select Vehicle --</option>
              <option>HiAce Bus - 656 GG4</option>
              <option>Outlander - 717 AM3</option>
              <option>Outlander - 402 LG5</option>
            </select>
          </div>
          <button class="btn btn-sign-out" id="btnSignOut">Sign Out</button>
        </div>

        <div class="panel" id="signInPanel">
          <h3>Sign In</h3>
          <div class="form-group">
            <label>Select Name</label>
            <select id="inName"><option value="">-- Select Name --</option></select>
          </div>
          <div class="form-group inline-flex">
            <div style="flex:1;"><label>Return Date</label><input type="text" id="returnDate"></div>
            <div style="flex:1;"><label>Return Time</label><input type="text" id="returnTime"></div>
          </div>
          <button class="btn btn-logs" id="btnLogs" style="margin-top:20px;">View Logs</button>
          <button class="btn btn-sign-in" id="btnSignIn" style="margin-top:20px;">Sign In / Return Key</button>
        </div>
      </div>
    </div>

    <div id="logViewer">
      <h2>Recent Logs</h2>
      <table id="logTable">
        <thead>
          <tr><th>Name</th><th>Part.</th><th>Veh.</th><th>Out</th><th>Time</th><th>In</th><th>Time</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <button class="btn btn-logs" id="btnBack">Back</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    // --- 1. CONFIG ---
    var firebaseConfig = {
      apiKey: "AIzaSyCDNhncWt-G9UsaA_nhtlVwz__EIu5CEe0",
      authDomain: "vehicle-key-register.firebaseapp.com",
      projectId: "vehicle-key-register",
      storageBucket: "vehicle-key-register.firebasestorage.app",
      messagingSenderId: "842294937790",
      appId: "1:842294937790:web:7822a611cd8e8a1a0476ef"
    };

    firebase.initializeApp(firebaseConfig);
    var db = firebase.firestore();

    // --- 2. STATE ---
    var inactivityTimer;
    var vehicles = { "HiAce Bus - 656 GG4": [], "Outlander - 717 AM3": [], "Outlander - 402 LG5": [] };
    var keysOut = {};
    var logData = [];
    var vehicleImageMap = {
      "HiAce Bus - 656 GG4": "hiace.jpg",
      "Outlander - 717 AM3": "outlander1.jpg",
      "Outlander - 402 LG5": "outlander2.jpg"
    };

    // --- 3. DATA SYNC (Using ES5 Syntax) ---
    db.collection("keyLogs").orderBy("Date Out", "desc").limit(50).onSnapshot(function(snapshot) {
      logData = [];
      vehicles = { "HiAce Bus - 656 GG4": [], "Outlander - 717 AM3": [], "Outlander - 402 LG5": [] };
      keysOut = {};

      snapshot.forEach(function(doc) {
        var data = doc.data();
        data.id = doc.id;
        logData.push(data);

        if (data["Date In"] === "") {
          if (vehicles[data.Vehicle]) vehicles[data.Vehicle].push(data.Name);
          keysOut[data.Name] = { id: doc.id, Vehicle: data.Vehicle };
        }
      });
      updateReturnNames();
      if (document.getElementById('logViewer').style.display === 'block') renderLogTable();
    });

    // --- 4. FUNCTIONS ---
    function signOut() {
      var name = document.getElementById('outName').value.trim();
      var part = document.getElementById('outParticipant').value.trim().toUpperCase();
      var dest = document.getElementById('outDestination').value.trim();
      var vehicle = document.getElementById('outVehicle').value;

      if (!name || !part || !dest || !vehicle) { alert("Fill all fields."); return; }
      if (vehicles[vehicle].length >= 2) { alert("Both keys for " + vehicle + " are out."); return; }

      var now = new Date();
      var dOut = document.getElementById('manualOutToggle').checked ? document.getElementById('outDateManual').value : formatDate(now);
      var tOut = document.getElementById('manualOutToggle').checked ? document.getElementById('outTimeManual').value : formatTime(now);

      db.collection("keyLogs").add({
        Name: name, Participant: part, Destination: dest, Vehicle: vehicle,
        "Date Out": dOut, "Time Out": tOut, "Date In": "", "Time In": ""
      }).then(function() {
        setupMainInterface();
      });
    }

    function signIn() {
      var name = document.getElementById('inName').value;
      var retDate = document.getElementById('returnDate').value.trim();
      var retTime = document.getElementById('returnTime').value.trim();
      if (!name) { alert("Select a name."); return; }

      db.collection("keyLogs").doc(keysOut[name].id).update({
        "Date In": retDate, "Time In": retTime
      }).then(function() {
        setupMainInterface();
      });
    }

    // --- 5. HELPERS ---
    function formatDate(d) { 
      return ('0'+d.getDate()).slice(-2)+"-"+('0'+(d.getMonth()+1)).slice(-2)+"-"+d.getFullYear(); 
    }
    function formatTime(d) {
      var h = d.getHours(), m = d.getMinutes(), ampm = h >= 12 ? "PM" : "AM";
      h = h % 12 || 12;
      return ('0'+h).slice(-2)+":"+('0'+m).slice(-2)+" "+ampm;
    }

    function setupWelcomeScreen() {
      document.getElementById('welcomeScreen').style.display = 'block';
      document.getElementById('mainInterface').style.display = 'none';
      document.getElementById('logViewer').style.display = 'none';
    }

    function setupMainInterface() {
      document.getElementById('welcomeScreen').style.display = 'none';
      document.getElementById('mainInterface').style.display = 'block';
      document.getElementById('logViewer').style.display = 'none';
      document.getElementById('outName').value = "";
      document.getElementById('outParticipant').value = "";
      document.getElementById('outDestination').value = "";
      document.getElementById('outVehicle').value = "";
      document.getElementById('vehiclePreview').style.display = 'none';
      var now = new Date();
      document.getElementById('returnDate').value = formatDate(now);
      document.getElementById('returnTime').value = formatTime(now);
    }

    function updateReturnNames() {
      var sel = document.getElementById('inName');
      sel.innerHTML = '<option value="">-- Select Name --</option>';
      for (var n in keysOut) {
        var o = document.createElement('option');
        o.value = n; o.textContent = n + " (" + keysOut[n].Vehicle + ")";
        sel.appendChild(o);
      }
    }

    function renderLogTable() {
      var tbody = document.querySelector('#logTable tbody');
      tbody.innerHTML = '';
      logData.forEach(function(e) {
        var tr = document.createElement('tr');
        var cols = [e.Name, e.Participant, e.Vehicle, e["Date Out"], e["Time Out"], e["Date In"], e["Time In"]];
        cols.forEach(function(val) {
          var td = document.createElement('td');
          td.textContent = val || "-";
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    function resetInactivityTimer() {
      clearTimeout(inactivityTimer);
      inactivityTimer = setTimeout(setupWelcomeScreen, 300000); // 5 mins
    }

    // --- 6. EVENT LISTENERS ---
    document.getElementById('continueBtn').onclick = setupMainInterface;
    document.getElementById('btnSignOut').onclick = signOut;
    document.getElementById('btnSignIn').onclick = signIn;
    document.getElementById('btnBack').onclick = setupMainInterface;
    document.getElementById('btnLogs').onclick = function() {
      document.getElementById('mainInterface').style.display = 'none';
      document.getElementById('logViewer').style.display = 'block';
      renderLogTable();
    };

    document.getElementById('outVehicle').onchange = function() {
      var img = document.getElementById('vehiclePreview');
      if (vehicleImageMap[this.value]) {
        img.src = vehicleImageMap[this.value];
        img.style.display = 'block';
      } else {
        img.style.display = 'none';
      }
    };

    document.getElementById('manualOutToggle').onchange = function() {
      document.getElementById('manualOutFields').style.display = this.checked ? 'flex' : 'none';
    };

    // iPad specific: Blur on Enter to hide keyboard
    document.getElementById('outDestination').onkeydown = function(e) {
      if (e.keyCode === 13) this.blur();
    };

    document.addEventListener('click', resetInactivityTimer);
    window.onload = setupWelcomeScreen;
  </script>
</body>
</html>
