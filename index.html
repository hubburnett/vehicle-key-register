  <script>

      var inactivityTimer;
      var justUnlocked = false;


      function resetInactivityTimer() {
        clearTimeout(inactivityTimer);
        inactivityTimer = setTimeout(function () {
          console.log("[✓] Auto-reset after 5 min of inactivity.");
          setupWelcomeScreen();
        }, 5 * 60 * 1000); // 5 minutes
      }

    
      function normalizeDate(s) {
      var re = /^(\d{1,2})([\/\-])(\d{1,2})\2(\d{2}|\d{4})$/;
      var m  = s.match(re);
      if (!m) return s;
      var day   = ('0' + parseInt(m[1],10)).slice(-2);
      var month = ('0' + parseInt(m[3],10)).slice(-2);
      var year  = m[4].length === 2 ? '20' + m[4] : m[4];
      return day + '-' + month + '-' + year;
    }
    
    function normalizeTime(s) {
      // same regex as isValidAmPm
      var re = /^\s*(1[0-2]|[1-9])[:\-\.]?([0-5]\d)\s*(AM|PM)\s*$/i;
      var m = s.match(re);
      if (!m) return s;
      var h    = parseInt(m[1], 10);
      var mm   = ('0' + parseInt(m[2], 10)).slice(-2);
      var ampm = m[3].toUpperCase();
      return pad2(h) + ':' + mm + ' ' + ampm;
    }
    
    function isValidDate(s) {
      // Matches 1-2 digits, slash or dash, 1-2 digits, same sep, 2-4 digits
      var re = /^(\d{1,2})([\/\-])(\d{1,2})\2(\d{2}|\d{4})$/;
      var m = s.match(re);
      if (!m) return false;
    
      var day   = parseInt(m[1], 10),
          month = parseInt(m[3], 10),
          year  = parseInt(m[4], 10);
      // normalize 2-digit year to 2000+ e.g. "21"→2021
      if (m[4].length === 2) year += 2000;
    
      // basic range checks
      if (month < 1 || month > 12) return false;
      var mdays = [
        31,
        ((year % 4 === 0 && year % 100 !== 0) || year % 400 === 0) ? 29 : 28,
        31,30,31,30,31,31,30,31,30,31
      ];
      return day >= 1 && day <= mdays[month - 1];
    }
    
    
    /**
     * Accepts flexible 12-hour times, e.g.:
     *   1:19PM   1-19PM   1.19 PM   12:05 am
     */
    function isValidAmPm(s) {
      // ^\s*                   optional leading spaces
      // (1[0-2]|[1-9])         hour: 1–9 or 10–12
      // [:\-\.]?               optional separator (: or - or .)
      // ([0-5]\d)              minutes: 00–59
      // \s*                    optional space
      // (AM|PM)                AM or PM
      // \s*$                   optional trailing spaces
      var re = /^\s*(0?[1-9]|1[0-2])[:\-\.]?([0-5]\d)\s*(AM|PM)\s*$/i;
      return re.test(s);
    }
    
    
    /**
     * Accepts either a valid date or a valid 12-hour time.
     */
    function isValidDateOrTime(s) {
      return isValidDate(s) || isValidAmPm(s);
    }
    
    // Global error handler
    window.onerror = function(msg, url, line) {
      alert("JS error: " + msg + "\n(line " + line + ")");
      return true;
    };
  
    // Data storage
    var vehicles = {
      "HiAce Bus - 656 GG4": [],
      "Outlander - 717 AM3": [],
      "Outlander - 402 LG5": []
    };
    var keysOut = {};
    var logData = [];
  
   
  
    // Helpers
    async function saveLogEntry(entry) {
      await fs.addDoc(fs.collection(db, "vehicleLogs"), entry);
    }
    
   async function loadLogs() {

    logData = [];
  
    const snapshot = await fs.getDocs(fs.collection(db, "vehicleLogs"));
  
    snapshot.forEach(function(document) {
      var data = document.data();
      logData.push(data);
  
      if (data["Date In"] === "") {
  
        keysOut[data.Name] = {
          Participant: data.Participant,
          Vehicle: data.Vehicle,
          DateOut: data["Date Out"],
          TimeOut: data["Time Out"]
        };
  
        if (!vehicles[data.Vehicle]) vehicles[data.Vehicle] = [];
        vehicles[data.Vehicle].push(data.Name);
  
      }
  
    });
  
    updateReturnNames();
    renderLogTable();
  }
      
    // UI setup functions
    function setupWelcomeScreen() {
      document.getElementById('welcomeScreen').style.display = 'block';
      document.getElementById('mainInterface').style.display = 'none';
      document.getElementById('logViewer').style.display = 'none';
    }
    
    ['click', 'touchstart', 'keydown'].forEach(function(evt) {
      document.addEventListener(evt, function () {
        resetInactivityTimer();
        updateDefaultTimestamps();
      });
    });

    function updateDefaultTimestamps() {
      var now = new Date();
      document.getElementById('returnDate').value = formatDate(now);
      document.getElementById('returnTime').value = formatTime(now);
    
      if (!document.getElementById('manualOutToggle').checked) {
        document.getElementById('outDateManual').value = formatDate(now);
        document.getElementById('outTimeManual').value = formatTime(now);
      }
    }

    function setupMainInterface() {
      document.getElementById('welcomeScreen').style.display = 'none';
      document.getElementById('mainInterface').style.display = 'block';
      document.getElementById('logViewer').style.display = 'none';
    
      // Clear all the sign-out fields
      document.getElementById('outName').value         = "";
      document.getElementById('outParticipant').value  = "";
      document.getElementById('outVehicle').value      = "";
      document.getElementById('outDestination').value  = "";      // ← clear Destination
      document.getElementById('manualOutToggle').checked = false; // ← un‐check manual toggle
      manualFields.style.display = 'none';                       // ← hide manual date/time inputs
    
      // Reset return inputs
      document.getElementById('returnDate').value = formatDate(new Date());
      document.getElementById('returnTime').value = formatTime(new Date());
      updateReturnNames();
    }
    function showLogViewer() {
      document.getElementById('mainInterface').style.display = 'none';
      document.getElementById('logViewer').style.display = 'block';
      renderLogTable();
    }

       
    // Sign-out logic
    var toggle = document.getElementById('manualOutToggle');
    var manualFields = document.getElementById('manualOutFields');
    var outDateManual = document.getElementById('outDateManual');
    var outTimeManual = document.getElementById('outTimeManual');
  
    async function signOut() {
      // ——— Clear any previous error highlights ———
      ['outName','outParticipant','outDestination','outVehicle'].forEach(function(id){
        var lbl = document.querySelector('label[for="'+id+'"]');
        if (lbl) lbl.classList.remove('error');
      });
    
      // ——— Grab field values ———
      var name    = document.getElementById('outName').value.trim();
      var part    = document.getElementById('outParticipant').value.trim().toUpperCase();
      var dest    = document.getElementById('outDestination').value.trim();
      var vehicle = document.getElementById('outVehicle').value;
    
      // ——— Check for missing fields ———
      var missing = [];
      if (!name)    missing.push('outName');
      if (!part)    missing.push('outParticipant');
      if (!dest)    missing.push('outDestination');
      if (!vehicle) missing.push('outVehicle');
    
      if (missing.length) {
        missing.forEach(function(id){
          var lbl = document.querySelector('label[for="'+id+'"]');
          if (lbl) lbl.classList.add('error');
        });
        alert("Please fill out all fields.");
        return;
      }
    
      // ——— Check key availability ———
      if (vehicles[vehicle].length >= 2) {
        alert("All keys for " + vehicle + " are signed out.");
        return;
      }
    
      // ——— Prepare default timestamps ———
      var now  = new Date();
      var dOut = formatDate(now);
      var tOut = formatTime(now);
    
      // ——— If manual entry, validate date and time ———
    if (toggle.checked) {
      // 1) grab raw
      var rawDate = outDateManual.value.trim();
      var rawTime = outTimeManual.value.trim();
    
      // 2) validate
      if (!isValidDate(rawDate)) {
        alert("Please enter a valid date (e.g. DD/MM/YYYY).");
        return;
      }
      if (!isValidAmPm(rawTime)) {
        alert("Please enter time in HH:MM AM/PM format (e.g. 1:18 PM).");
        return;
      }
    
      // 3) normalize & assign
      dOut = normalizeDate(rawDate);
      tOut = normalizeTime(rawTime);
    }

      // ——— Record sign-out ———
      vehicles[vehicle].push(name);
      keysOut[name] = {
        Participant: part,
        Vehicle: vehicle,
        DateOut: dOut,
        TimeOut: tOut
      };
     var entry = {
      Name: name,
      Participant: part,
      Destination: dest,
      Vehicle: vehicle,
      "Date Out": dOut,
      "Time Out": tOut,
      "Date In": "",
      "Time In": ""
    };
    
    logData.push(entry);
    
    await saveLogEntry(entry);
    
      // ——— Clear error highlights after success ———
      ['outName','outParticipant','outDestination','outVehicle'].forEach(function(id){
        var lbl = document.querySelector('label[for="'+id+'"]');
        if (lbl) lbl.classList.remove('error');
      });
    
      alert(name + " signed out a key for " + vehicle + ".");
     
      document.getElementById('vehiclePreview').style.display = 'none';
      setupMainInterface();
    }
  
    // Sign-in logic
    async function signIn() {
      var sel     = document.getElementById('inName');
      var name    = sel.value;
      var retDate = document.getElementById('returnDate').value.trim();
      var retTime = document.getElementById('returnTime').value.trim();
    
      // ① All fields required
      if (!name || !retDate || !retTime) {
        alert("Please select a name and enter both return date and time.");
        return;
      }

      const snapshot = await fs.getDocs(fs.collection(db, "vehicleLogs"));

      snapshot.forEach(async function(document) {
      
        var data = document.data();
      
        if (
          data.Name === name &&
          data.Vehicle === rec.Vehicle &&
          data["Date In"] === ""
        ) {
      
          await fs.updateDoc(
            fs.doc(db, "vehicleLogs", document.id),
            {
              "Date In": retDate,
              "Time In": retTime
            }
          );
      
        }
      
      });
      
      // ② Validate date format
      if (!isValidDate(retDate)) {
        alert("Please enter a valid return date (e.g. DD/MM/YYYY or D-M-YY).");
        return;
      }
      
      retDate = normalizeDate(retDate);
      
      
      // ③ Validate time format
      if (!isValidAmPm(retTime)) {
        alert("Please enter a valid return time (e.g. 1:18 PM, 2-05PM or 3.30 AM).");
        return;
      }
      
      retTime = normalizeTime(retTime);
      
      // ④ Confirm this user actually has a key out
      if (!keysOut[name]) {
        alert("This name does not have a key signed out.");
        return;
      }
    
      // ⑤ Perform the sign-in
      var rec = keysOut[name];
      delete keysOut[name];
    
      var idx = vehicles[rec.Vehicle].indexOf(name);
      if (idx > -1) vehicles[rec.Vehicle].splice(idx, 1);
    
      for (var i = 0; i < logData.length; i++) {
        var e = logData[i];
        if (e.Name === name && e.Vehicle === rec.Vehicle && !e["Date In"]) {
          e["Date In"] = retDate;
          e["Time In"] = retTime;
          break;
        }
      }
    
      alert(name + " returned a key for " + rec.Vehicle + ".");    
      setupMainInterface();
    }

         
  
    // Populate the Sign-In dropdown
    function updateReturnNames() {
      var sel = document.getElementById('inName');
      sel.innerHTML = '<option value="">-- Select Name --</option>';
      for (var n in keysOut) {
        var o = document.createElement('option');
        o.value = n;
        o.textContent = n;
        sel.appendChild(o);
      }
    }
  
    // Render the Log Viewer table
    function renderLogTable() {
      var tbody = document.querySelector('#logTable tbody');
      tbody.innerHTML = '';
      var cols = ["Name","Participant","Destination","Vehicle","Date Out","Time Out","Date In","Time In"];
      if (logData.length === 0) {
        var tr = document.createElement('tr');
        var td = document.createElement('td');
        td.colSpan = cols.length;
        td.textContent = "No records yet";
        tr.appendChild(td);
        tbody.appendChild(tr);
        return;
      }
      for (var i = 0; i < logData.length; i++) {
        var entry = logData[i];
        var tr = document.createElement('tr');
        for (var j = 0; j < cols.length; j++) {
          var td = document.createElement('td');
          td.textContent = entry[cols[j]];
          td.contentEditable = true;
          td.classList.add('editable-cell');
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
      // Make cells editable & save on blur
      var cells = tbody.querySelectorAll('.editable-cell');
      for (var k = 0; k < cells.length; k++) {
        (function(cell) {
          cell.addEventListener('blur', function(e) {
            var rowIdx = cell.parentElement.rowIndex - 1;
            var colKey = cols[cell.cellIndex];
            logData[rowIdx][colKey] = cell.textContent.trim();           
          });
        })(cells[k]);
      }
    }
  
    // Uniform event bindings for all buttons using touchend

    // Logs Button
    document.getElementById('btnLogs').addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      showLogViewer();
    }, { passive: false });
    
    // Continue Button
    document.getElementById('continueBtn').addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      setupMainInterface();
    }, { passive: false });
    
    // Sign Out Button
    document.getElementById('btnSignOut').addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      signOut();
    }, { passive: false });
    
    // Sign In Button
    document.getElementById('btnSignIn').addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      signIn();
    }, { passive: false });
  
    document.getElementById('btnBack').addEventListener('click', function(e) {
      e.preventDefault();
      setupMainInterface();
    }, { passive: false });
  
    
    document.getElementById('btnRefreshLog').addEventListener('click', function(e) {
      e.preventDefault();
      updateReturnNames();
      renderLogTable();
      alert("✅ Refreshed sign-in list and log table.");
    }, { passive: false });


  
    // Vehicle preview on select
    var vehicleImageMap = {
      "HiAce Bus - 656 GG4": "hiace.jpg",
      "Outlander - 717 AM3": "outlander1.jpg",
      "Outlander - 402 LG5": "outlander2.jpg"
    };
    document.getElementById('outVehicle')
      .addEventListener('change', function() {
        var img = document.getElementById('vehiclePreview');
        if (vehicleImageMap[this.value]) {
          img.src = vehicleImageMap[this.value];
          img.style.display = 'block';
        } else {
          img.style.display = 'none';
        }
      });
  
    // Hide UI and return to welcome on visibility change
    document.addEventListener('visibilitychange', function() {
      if (document.hidden) setupWelcomeScreen();
    });

       // Hide keyboard on Enter in Destination field
    document.getElementById('outDestination').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.keyCode === 13) {
        e.preventDefault();
        this.blur();
      }
    });
  
    // Toggle manual date/time fields
    toggle.addEventListener('change', function() {
      if (toggle.checked) {
        manualFields.style.display = 'flex';
        outDateManual.value = formatDate(new Date());
        outTimeManual.value  = formatTime(new Date());
      } else {
        manualFields.style.display = 'none';
      }
    });
  
    // Initialize
  loadLogs();
  setupWelcomeScreen();
  resetInactivityTimer();
  </script>
</body>
